[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openproxy-ai"
version = "0.1.0"
description = "Python SDK for OpenProxyAI — the enterprise LLM gateway"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenProxyAI" }]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
