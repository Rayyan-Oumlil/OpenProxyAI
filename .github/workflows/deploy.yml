name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production]

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

env:
  REGION: ${{ secrets.GCP_REGION }}
  IMAGE: ${{ secrets.GCP_AR_IMAGE }}

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openproxyai_test
          POSTGRES_USER: openproxyai
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://openproxyai:testpassword@localhost:5432/openproxyai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          APP_ENV: test
        run: python -m pytest tests/ -q --tb=short -m "not integration"

  # ── Build & Push ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ env.IMAGE }}:latest" \
            ./backend
          docker push "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ env.IMAGE }}:latest"

  # ── Migrate ──────────────────────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run alembic upgrade head via Cloud Run job
        run: |
          # Delete old job if it exists, then create fresh (avoids create/update race)
          gcloud run jobs delete openproxyai-migrate \
            --region="${{ env.REGION }}" --quiet 2>/dev/null || true
          gcloud run jobs create openproxyai-migrate \
            --image="${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ secrets.GCP_DB_CONNECTION_NAME }}" \
            --vpc-connector="${{ secrets.GCP_VPC_CONNECTOR }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.MIGRATION_DATABASE_URL }}" \
            --set-env-vars="REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars="SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars="APP_ENV=production" \
            --command="alembic" \
            --args="upgrade,head" \
            --max-retries=1 \
            --quiet
          gcloud run jobs execute openproxyai-migrate \
            --region="${{ env.REGION }}" \
            --wait \
            --quiet

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply Artifact Registry cleanup policy
        run: |
          gcloud artifacts repositories set-cleanup-policies openproxyai \
            --project="$(echo ${{ secrets.GCP_AR_IMAGE }} | cut -d'/' -f2)" \
            --location="${{ env.REGION }}" \
            --policy=deploy/gcp/artifact-registry-cleanup-policy.json \
            --no-dry-run \
            --quiet
        continue-on-error: true  # Requires artifactregistry.repoAdmin on GCP_*; run deploy/gcp/setup.sh if missing

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --image="${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ secrets.GCP_DB_CONNECTION_NAME }}" \
            --vpc-connector="${{ secrets.GCP_VPC_CONNECTOR }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=60 \
            --concurrency=80 \
            --set-env-vars="APP_ENV=production" \
            --set-env-vars="DEBUG=false" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars="SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars="CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
            --set-env-vars="CACHE_ENABLED=true" \
            --set-env-vars="SEMANTIC_CACHE_ENABLED=true" \
            --set-env-vars="STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars="STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --set-env-vars="STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --set-env-vars="STRIPE_STARTER_PRICE_ID=${{ secrets.STRIPE_STARTER_PRICE_ID }}" \
            --set-env-vars="STRIPE_GROWTH_PRICE_ID=${{ secrets.STRIPE_GROWTH_PRICE_ID }}" \
            --set-env-vars="STRIPE_METERED_PRICE_ID=${{ secrets.STRIPE_METERED_PRICE_ID }}" \
            --set-env-vars="STRIPE_SUCCESS_URL=${{ secrets.STRIPE_SUCCESS_URL }}" \
            --set-env-vars="STRIPE_CANCEL_URL=${{ secrets.STRIPE_CANCEL_URL }}" \
            --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --set-env-vars="ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --set-env-vars="LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --set-env-vars="LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            --set-env-vars="PROMETHEUS_ENABLED=true" \
            --set-env-vars="APP_BASE_URL=${{ secrets.APP_BASE_URL }}" \
            --set-env-vars="FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}" \
            --set-env-vars="STRIPE_METERED_BASE_PRICE_ID=${{ secrets.STRIPE_METERED_BASE_PRICE_ID }}" \
            --quiet

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)")
          echo "✅ Backend live at: $URL"
