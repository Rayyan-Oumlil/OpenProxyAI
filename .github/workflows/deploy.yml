name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin-console/**"
      - "web-app/**"
      - "docker-compose.demo.yml"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  # PRs run test/lint/build jobs only (incl. migrations, RLS and e2e); never build/migrate/deploy.
  pull_request:
    paths:
      - "backend/**"
      - "admin-console/**"
      - "web-app/**"
      - "docker-compose.demo.yml"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production]

# Read-only by default. PR/push jobs run repo code (pip/npm), so they must not be able to mint cloud tokens.
permissions:
  contents: read

env:
  REGION: ${{ secrets.GCP_REGION }}
  IMAGE: ${{ secrets.GCP_AR_IMAGE }}

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector: the migration chain creates the semantic cache's vector column.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: openproxyai_test
          POSTGRES_USER: openproxyai
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (ruff, real-error rules from backend/ruff.toml)
        run: ruff check .
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://openproxyai:testpassword@localhost:5432/openproxyai_test
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
        run: alembic upgrade head
      # Unit tests plus the end-to-end pipeline suite (real app, Postgres, Redis, fake OpenAI upstream).
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://openproxyai:testpassword@localhost:5432/openproxyai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          APP_ENV: test
          E2E_TESTS_REQUIRED: "1"
        run: python -m pytest tests/ -q --tb=short -m "not integration"
      - name: Row-level security integration tests (real Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://openproxyai:testpassword@localhost:5432/openproxyai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          APP_ENV: test
          RLS_TESTS_REQUIRED: "1"
        # The CI login role is a superuser, which is exactly the case these tests must survive.
        run: python -m pytest tests/test_rls_isolation.py -q --tb=short -m integration -rs

  # ── Frontends (build + tests only; nothing here deploys) ────────────────────
  admin-console:
    name: Admin Console (typecheck, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # tsc -b (typecheck) && vite build
      - run: npm test
      - name: Install the website's dependencies (e2e/website.spec.ts serves it)
        run: npm ci
        working-directory: web-app
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test (mocked API)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-console-playwright-report
          path: admin-console/playwright-report
          retention-days: 7

  # Boots the seeded demo stack from scratch and checks it over HTTP (docker-compose.demo.yml, scripts/smoke.sh).
  demo-smoke:
    name: Demo smoke (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/smoke.sh
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color --tail 200

  web-app:
    name: Web App (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ── Build & Push ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation; deploy jobs only
    needs: test
    # GCP deploys are manual only: pushes and PRs run tests, never build/migrate/deploy.
    if: github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        run: |
          docker build \
            -t "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ env.IMAGE }}:latest" \
            ./backend
          docker push "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ env.IMAGE }}:latest"

  # ── Migrate ──────────────────────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation; deploy jobs only
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run alembic upgrade head via Cloud Run job
        run: |
          # Delete old job if it exists, then create fresh (avoids create/update race)
          gcloud run jobs delete openproxyai-migrate \
            --region="${{ env.REGION }}" --quiet 2>/dev/null || true
          gcloud run jobs create openproxyai-migrate \
            --image="${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ secrets.GCP_DB_CONNECTION_NAME }}" \
            --vpc-connector="${{ secrets.GCP_VPC_CONNECTOR }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.MIGRATION_DATABASE_URL }}" \
            --set-env-vars="REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars="SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars="APP_ENV=production" \
            --command="alembic" \
            --args="upgrade,head" \
            --max-retries=1 \
            --quiet
          gcloud run jobs execute openproxyai-migrate \
            --region="${{ env.REGION }}" \
            --wait \
            --quiet

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation; deploy jobs only
    needs: [build, migrate]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply Artifact Registry cleanup policy
        run: |
          gcloud artifacts repositories set-cleanup-policies openproxyai \
            --project="$(echo ${{ secrets.GCP_AR_IMAGE }} | cut -d'/' -f2)" \
            --location="${{ env.REGION }}" \
            --policy=deploy/gcp/artifact-registry-cleanup-policy.json \
            --no-dry-run \
            --quiet
        continue-on-error: true  # Requires artifactregistry.repoAdmin on GCP_*; run deploy/gcp/setup.sh if missing

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --image="${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ secrets.GCP_DB_CONNECTION_NAME }}" \
            --vpc-connector="${{ secrets.GCP_VPC_CONNECTOR }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=60 \
            --concurrency=80 \
            --set-env-vars="APP_ENV=production" \
            --set-env-vars="DEBUG=false" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars="SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars="CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
            --set-env-vars="CACHE_ENABLED=true" \
            --set-env-vars="SEMANTIC_CACHE_ENABLED=true" \
            --set-env-vars="STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars="STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --set-env-vars="STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --set-env-vars="STRIPE_STARTER_PRICE_ID=${{ secrets.STRIPE_STARTER_PRICE_ID }}" \
            --set-env-vars="STRIPE_GROWTH_PRICE_ID=${{ secrets.STRIPE_GROWTH_PRICE_ID }}" \
            --set-env-vars="STRIPE_METERED_PRICE_ID=${{ secrets.STRIPE_METERED_PRICE_ID }}" \
            --set-env-vars="STRIPE_SUCCESS_URL=${{ secrets.STRIPE_SUCCESS_URL }}" \
            --set-env-vars="STRIPE_CANCEL_URL=${{ secrets.STRIPE_CANCEL_URL }}" \
            --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --set-env-vars="ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --set-env-vars="LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --set-env-vars="LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            --set-env-vars="PROMETHEUS_ENABLED=true" \
            --set-env-vars="APP_BASE_URL=${{ secrets.APP_BASE_URL }}" \
            --set-env-vars="FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}" \
            --set-env-vars="STRIPE_METERED_BASE_PRICE_ID=${{ secrets.STRIPE_METERED_BASE_PRICE_ID }}" \
            --quiet

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)")
          echo "✅ Backend live at: $URL"
