name: Web App

on:
  pull_request:
    paths: ["web-app-next/**", "backend/tests/**", "backend/alembic/versions/**", "backend/app/**", ".github/workflows/web-app.yml"]
  push:
    branches: [main]
    paths: ["web-app-next/**", ".github/workflows/web-app.yml"]

jobs:
  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Map snapshots are recorded per OS; CI (linux) records its own baseline on first run.
      - run: npx playwright test --update-snapshots=missing
      - name: Upload Playwright snapshots and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web-app-next/e2e/**/*-snapshots/
            web-app-next/test-results/
          retention-days: 7
      - run: npm run lhci
