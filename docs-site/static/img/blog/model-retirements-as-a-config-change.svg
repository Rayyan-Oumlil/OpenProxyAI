<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="300" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Retire a model with one edit</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Callers ask for a job. The registry picks the model.</text>

  <rect x="24" y="92" width="170" height="64" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="36" y="116" fill="#f4f6f8" font-size="14" font-weight="600">Service asks for</text>
  <text x="36" y="138" fill="#cfd5dd" font-size="14">a capability</text>

  <rect x="24" y="176" width="170" height="64" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="36" y="200" fill="#f4f6f8" font-size="14" font-weight="600">Script names</text>
  <text x="36" y="222" fill="#cfd5dd" font-size="14">the old model</text>

  <rect x="234" y="84" width="190" height="164" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="246" y="110" fill="#f4f6f8" font-size="14" font-weight="600">Model registry</text>
  <text x="246" y="136" fill="#cfd5dd" font-size="14">Old model: disabled</text>
  <text x="246" y="158" fill="#cfd5dd" font-size="14">New model: enabled</text>
  <text x="246" y="180" fill="#a3abb8" font-size="14">Own data class,</text>
  <text x="246" y="200" fill="#a3abb8" font-size="14">regions, retention</text>
  <text x="246" y="226" fill="#a3abb8" font-size="14">Same capability</text>

  <rect x="464" y="92" width="152" height="64" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="476" y="116" fill="#f4f6f8" font-size="14" font-weight="600">New model</text>
  <text x="476" y="138" fill="#cfd5dd" font-size="14">answers</text>

  <rect x="464" y="176" width="152" height="64" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="476" y="200" fill="#f4f6f8" font-size="14" font-weight="600">Clear refusal</text>
  <text x="476" y="222" fill="#cfd5dd" font-size="14">HTTP 446, logged</text>

  <line x1="194" y1="124" x2="234" y2="124" stroke="#35d399" stroke-width="2"/>
  <line x1="194" y1="208" x2="234" y2="208" stroke="#f0b429" stroke-width="2"/>
  <line x1="424" y1="124" x2="464" y2="124" stroke="#35d399" stroke-width="2"/>
  <line x1="424" y1="208" x2="464" y2="208" stroke="#f0b429" stroke-width="2"/>

  <text x="24" y="278" fill="#a3abb8" font-size="14">No code change in the service.</text>
</svg>
