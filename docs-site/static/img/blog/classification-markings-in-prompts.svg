<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="300" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Markings decide where a prompt can go</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Two controls, checked before any provider sees the text</text>

  <rect x="24" y="96" width="150" height="124" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="124" fill="#f0b429" font-size="14" font-weight="600">Prompt</text>
  <text x="40" y="148" fill="#cfd5dd" font-size="14">pasted text with</text>
  <text x="40" y="170" fill="#cfd5dd" font-size="14">a marking such as</text>
  <text x="40" y="192" fill="#cfd5dd" font-size="14">Internal use only</text>

  <rect x="214" y="96" width="150" height="124" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="230" y="124" fill="#35d399" font-size="14" font-weight="600">Gateway</text>
  <text x="230" y="148" fill="#cfd5dd" font-size="14">1. blocked phrases</text>
  <text x="230" y="170" fill="#cfd5dd" font-size="14">2. data class</text>
  <text x="230" y="192" fill="#cfd5dd" font-size="14">3. cleared models</text>

  <rect x="426" y="86" width="190" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="440" y="113" fill="#f0b429" font-size="14" font-weight="600">Phrase match: 446</text>

  <rect x="426" y="140" width="190" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="440" y="167" fill="#cfd5dd" font-size="14">Cleared models only</text>

  <rect x="426" y="194" width="190" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="440" y="221" fill="#cfd5dd" font-size="14">No marking: served</text>

  <path d="M174 158 H212" stroke="#35d399" stroke-width="2"/>
  <path d="M364 150 H395 V108 H424 M395 150 V162 H424 M395 150 V216 H424" stroke="#35d399" stroke-width="2" fill="none"/>
  <text x="24" y="272" fill="#a3abb8" font-size="14">Start in log-only: record hits, fix noisy phrases, then enforce.</text>
</svg>
