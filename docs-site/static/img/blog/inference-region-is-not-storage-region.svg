<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="300" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Two regions, two questions</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Answer both before you say "EU only"</text>

  <rect x="24" y="88" width="288" height="136" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="40" y="114" fill="#35d399" font-size="14" font-weight="600">Where the prompt is processed</text>
  <text x="40" y="142" fill="#cfd5dd" font-size="14">Organization region: EU</text>
  <text x="40" y="166" fill="#cfd5dd" font-size="14">Keys tagged EU or global</text>
  <text x="40" y="190" fill="#cfd5dd" font-size="14">Models listed for EU</text>
  <text x="40" y="212" fill="#a3abb8" font-size="14">Enforced by the gateway</text>

  <rect x="328" y="88" width="288" height="136" rx="10" fill="#14171e" stroke="#f0b429"/>
  <text x="344" y="114" fill="#f0b429" font-size="14" font-weight="600">Where data sits at rest</text>
  <text x="344" y="142" fill="#cfd5dd" font-size="14">Gateway database and logs</text>
  <text x="344" y="166" fill="#cfd5dd" font-size="14">Where you deploy the gateway</text>
  <text x="344" y="190" fill="#cfd5dd" font-size="14">Provider-side storage</text>
  <text x="344" y="212" fill="#a3abb8" font-size="14">Set in the provider account</text>

  <rect x="24" y="240" width="592" height="40" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="265" fill="#cfd5dd" font-size="14">Failover stays inside the region: no in-region key means a clear error.</text>
</svg>
