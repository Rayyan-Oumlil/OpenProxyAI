<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="250" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="249" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Three steps from new rule to enforced rule</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Nobody is blocked until you have read the evidence</text>

  <rect x="24" y="86" width="184" height="104" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="114" fill="#f0b429" font-size="14" font-weight="600">1. Log-only</text>
  <text x="40" y="138" fill="#cfd5dd" font-size="14">hits are recorded</text>
  <text x="40" y="160" fill="#cfd5dd" font-size="14">requests still pass</text>

  <rect x="228" y="86" width="184" height="104" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="244" y="114" fill="#f0b429" font-size="14" font-weight="600">2. Read activity</text>
  <text x="244" y="138" fill="#cfd5dd" font-size="14">which rule, how often</text>
  <text x="244" y="160" fill="#cfd5dd" font-size="14">tighten noisy rules</text>

  <rect x="432" y="86" width="184" height="104" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="448" y="114" fill="#35d399" font-size="14" font-weight="600">3. Enforce</text>
  <text x="448" y="138" fill="#cfd5dd" font-size="14">blocked with a 446</text>
  <text x="448" y="160" fill="#cfd5dd" font-size="14">and a plain reason</text>

  <path d="M208 138 H226 M412 138 H430" stroke="#35d399" stroke-width="2"/>
  <text x="24" y="226" fill="#cfd5dd" font-size="14">Keep watching after step 3: new teams and new prompts bring new hits.</text>
</svg>
