<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3abb8"/>
    </marker>
  </defs>
  <rect width="640" height="430" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="429" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">What the new spec removes</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">2025-11-25 keeps a session. 2026-07-28 does not.</text>

  <g font-size="15">
    <rect x="24" y="86" width="592" height="150" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="114" fill="#f4f6f8" font-weight="600" font-size="16">2025-11-25  (what our gateway speaks)</text>
    <rect x="42" y="132" width="120" height="44" rx="8" fill="#0d0f14" stroke="#2a2f3a"/>
    <text x="102" y="160" fill="#cfd5dd" text-anchor="middle">Agent</text>
    <rect x="252" y="132" width="120" height="44" rx="8" fill="#0d0f14" stroke="#35d399"/>
    <text x="312" y="160" fill="#cfd5dd" text-anchor="middle">Gateway</text>
    <rect x="462" y="132" width="136" height="44" rx="8" fill="#0d0f14" stroke="#2a2f3a"/>
    <text x="530" y="160" fill="#cfd5dd" text-anchor="middle">Tool server</text>
    <path d="M162 154 H246" stroke="#a3abb8" stroke-width="2" marker-end="url(#b)"/>
    <path d="M372 154 H456" stroke="#a3abb8" stroke-width="2" marker-end="url(#b)"/>
    <rect x="42" y="192" width="236" height="30" rx="15" fill="#0f1f19" stroke="#35d399"/>
    <text x="160" y="212" fill="#35d399" text-anchor="middle" font-weight="600" font-size="14">Mcp-Session-Id on every call</text>
  </g>

  <g font-size="15">
    <rect x="24" y="260" width="592" height="150" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="288" fill="#f4f6f8" font-weight="600" font-size="16">2026-07-28</text>
    <rect x="42" y="306" width="120" height="44" rx="8" fill="#0d0f14" stroke="#2a2f3a"/>
    <text x="102" y="334" fill="#cfd5dd" text-anchor="middle">Agent</text>
    <rect x="252" y="306" width="120" height="44" rx="8" fill="#0d0f14" stroke="#35d399"/>
    <text x="312" y="334" fill="#cfd5dd" text-anchor="middle">Gateway</text>
    <rect x="462" y="306" width="136" height="44" rx="8" fill="#0d0f14" stroke="#2a2f3a"/>
    <text x="530" y="334" fill="#cfd5dd" text-anchor="middle">Tool server</text>
    <path d="M162 328 H246" stroke="#a3abb8" stroke-width="2" marker-end="url(#b)"/>
    <path d="M372 328 H456" stroke="#a3abb8" stroke-width="2" marker-end="url(#b)"/>
    <rect x="42" y="366" width="340" height="30" rx="15" fill="#14171e" stroke="#f0b429"/>
    <text x="212" y="386" fill="#f0b429" text-anchor="middle" font-weight="600" font-size="14">No session. Mcp-Method and Mcp-Name headers</text>
  </g>
</svg>
