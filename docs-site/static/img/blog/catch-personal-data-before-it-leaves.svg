<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="320" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="319" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Same check, two modes</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Start in log-only, move to enforce when the hits look right</text>

  <rect x="24" y="96" width="130" height="56" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="129" fill="#cfd5dd" font-size="14">Request</text>
  <rect x="200" y="96" width="170" height="56" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="216" y="129" fill="#cfd5dd" font-size="14">Personal data check</text>
  <line x1="154" y1="124" x2="198" y2="124" stroke="#35d399" stroke-width="2"/>

  <rect x="416" y="88" width="200" height="56" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="432" y="112" fill="#cfd5dd" font-size="14">Log-only: recorded,</text>
  <text x="432" y="132" fill="#cfd5dd" font-size="14">request goes through</text>
  <rect x="416" y="160" width="200" height="56" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="432" y="184" fill="#cfd5dd" font-size="14">Enforce: stopped at</text>
  <text x="432" y="204" fill="#cfd5dd" font-size="14">the gateway, HTTP 446</text>
  <line x1="370" y1="116" x2="414" y2="116" stroke="#35d399" stroke-width="2"/>
  <line x1="370" y1="134" x2="414" y2="186" stroke="#f0b429" stroke-width="2"/>

  <rect x="24" y="240" width="592" height="56" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="264" fill="#cfd5dd" font-size="14">The caller sees one plain sentence. The audit log keeps the reason,</text>
  <text x="40" y="284" fill="#a3abb8" font-size="14">not the personal data itself.</text>
</svg>
