<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Inter, system-ui, sans-serif">
  <title>Regulated prompts pass through one gateway that checks, routes and records</title>
  <rect x="0.5" y="0.5" width="639" height="319" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
  <text x="24" y="38" font-size="20" font-weight="600" fill="#f4f6f8">One checkpoint for regulated prompts</text>

  <rect x="24" y="70" width="130" height="150" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="89" y="100" font-size="14" font-weight="600" fill="#cfd5dd" text-anchor="middle">Your apps</text>
  <text x="89" y="128" font-size="14" fill="#a3abb8" text-anchor="middle">Clinical tools</text>
  <text x="89" y="152" font-size="14" fill="#a3abb8" text-anchor="middle">Payment ops</text>
  <text x="89" y="176" font-size="14" fill="#a3abb8" text-anchor="middle">Agencies</text>
  <text x="89" y="200" font-size="14" fill="#a3abb8" text-anchor="middle">EU products</text>

  <rect x="200" y="70" width="240" height="150" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="320" y="98" font-size="14" font-weight="600" fill="#35d399" text-anchor="middle">OpenProxyAI gateway</text>
  <text x="320" y="128" font-size="14" fill="#cfd5dd" text-anchor="middle">1. Who is asking (SSO)</text>
  <text x="320" y="152" font-size="14" fill="#cfd5dd" text-anchor="middle">2. PII and keyword check</text>
  <text x="320" y="176" font-size="14" fill="#cfd5dd" text-anchor="middle">3. Model and region check</text>
  <text x="320" y="200" font-size="14" fill="#cfd5dd" text-anchor="middle">4. Log the decision</text>

  <rect x="486" y="70" width="130" height="62" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="551" y="97" font-size="14" font-weight="600" fill="#cfd5dd" text-anchor="middle">Approved</text>
  <text x="551" y="117" font-size="14" fill="#a3abb8" text-anchor="middle">providers</text>

  <rect x="486" y="158" width="130" height="62" rx="10" fill="#14171e" stroke="#f0b429"/>
  <text x="551" y="185" font-size="14" font-weight="600" fill="#f0b429" text-anchor="middle">Blocked: 446</text>
  <text x="551" y="205" font-size="14" fill="#a3abb8" text-anchor="middle">with a reason</text>

  <path d="M154 145 H200" stroke="#a3abb8" stroke-width="2" fill="none"/>
  <path d="M440 101 H486" stroke="#35d399" stroke-width="2" fill="none"/>
  <path d="M440 189 H486" stroke="#f0b429" stroke-width="2" fill="none"/>

  <rect x="200" y="248" width="240" height="46" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="320" y="268" font-size="14" font-weight="600" fill="#cfd5dd" text-anchor="middle">Append-only audit trail</text>
  <text x="320" y="286" font-size="14" fill="#a3abb8" text-anchor="middle">evidence for your auditor</text>
  <path d="M320 220 V248" stroke="#a3abb8" stroke-width="2" fill="none"/>
</svg>
