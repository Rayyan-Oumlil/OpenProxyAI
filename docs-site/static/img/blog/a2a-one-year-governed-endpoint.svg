<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="400" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Where a gateway sits when agents talk</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Agents call each other directly, and call models and tools through one door</text>
  <g font-size="14">
    <rect x="24" y="88" width="170" height="54" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="109" y="120" fill="#f4f6f8" font-weight="600" text-anchor="middle">Agent A</text>
    <rect x="446" y="88" width="170" height="54" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="531" y="120" fill="#f4f6f8" font-weight="600" text-anchor="middle">Agent B</text>
    <line x1="194" y1="115" x2="446" y2="115" stroke="#f0b429" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="320" y="106" fill="#f0b429" text-anchor="middle">agent to agent protocol</text>
    <text x="320" y="136" fill="#a3abb8" text-anchor="middle">direct, between the agents</text>

    <line x1="109" y1="142" x2="109" y2="200" stroke="#35d399" stroke-width="2"/>
    <line x1="531" y1="142" x2="531" y2="200" stroke="#35d399" stroke-width="2"/>
    <line x1="109" y1="200" x2="250" y2="200" stroke="#35d399" stroke-width="2"/>
    <line x1="531" y1="200" x2="390" y2="200" stroke="#35d399" stroke-width="2"/>
    <line x1="320" y1="200" x2="320" y2="208" stroke="#35d399" stroke-width="2"/>
    <text x="122" y="178" fill="#a3abb8">model and tool calls</text>

    <rect x="130" y="208" width="380" height="82" rx="10" fill="#0f1f19" stroke="#35d399"/>
    <text x="320" y="236" fill="#f4f6f8" font-weight="600" font-size="16" text-anchor="middle">OpenProxyAI governed endpoint</text>
    <text x="320" y="260" fill="#cfd5dd" text-anchor="middle">Keys, limits, policy, MCP tool rules</text>
    <text x="320" y="278" fill="#a3abb8" text-anchor="middle">One audit trail for every call</text>

    <line x1="230" y1="290" x2="230" y2="326" stroke="#35d399" stroke-width="2"/>
    <line x1="410" y1="290" x2="410" y2="326" stroke="#35d399" stroke-width="2"/>
    <rect x="130" y="326" width="200" height="50" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="230" y="356" fill="#cfd5dd" text-anchor="middle">Model providers</text>
    <rect x="310" y="326" width="200" height="50" rx="10" fill="#14171e" stroke="#2a2f3a" transform="translate(20 0)"/>
    <text x="430" y="356" fill="#cfd5dd" text-anchor="middle">MCP tool servers</text>
  </g>
</svg>
