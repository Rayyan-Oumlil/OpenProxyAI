<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="260" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="259" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Five checks, one afternoon</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Each has a command to run and a clear pass</text>

  <rect x="24" y="86" width="108" height="96" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="36" y="112" fill="#f0b429" font-size="14" font-weight="600">1. Request</text>
  <text x="36" y="136" fill="#cfd5dd" font-size="14">one key</text>
  <text x="36" y="158" fill="#cfd5dd" font-size="14">cache hit</text>

  <rect x="140" y="86" width="108" height="96" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="152" y="112" fill="#f0b429" font-size="14" font-weight="600">2. Policy</text>
  <text x="152" y="136" fill="#cfd5dd" font-size="14">446 block</text>
  <text x="152" y="158" fill="#cfd5dd" font-size="14">no upstream</text>

  <rect x="256" y="86" width="108" height="96" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="268" y="112" fill="#f0b429" font-size="14" font-weight="600">3. Budget</text>
  <text x="268" y="136" fill="#cfd5dd" font-size="14">429 stop</text>
  <text x="268" y="158" fill="#cfd5dd" font-size="14">names limit</text>

  <rect x="372" y="86" width="108" height="96" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="384" y="112" fill="#f0b429" font-size="14" font-weight="600">4. Failover</text>
  <text x="384" y="136" fill="#cfd5dd" font-size="14">backup</text>
  <text x="384" y="158" fill="#cfd5dd" font-size="14">model serves</text>

  <rect x="488" y="86" width="128" height="96" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="500" y="112" fill="#35d399" font-size="14" font-weight="600">5. Audit</text>
  <text x="500" y="136" fill="#cfd5dd" font-size="14">find each</text>
  <text x="500" y="158" fill="#cfd5dd" font-size="14">decision</text>

  <path d="M132 134 H138 M248 134 H254 M364 134 H370 M480 134 H486" stroke="#35d399" stroke-width="2"/>
  <text x="24" y="224" fill="#cfd5dd" font-size="14">Demo: Docker, no provider key. Score each row pass or fail.</text>
</svg>
