<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">The region rule lives in the gateway</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Applications send requests. The gateway decides where they may go</text>

  <rect x="24" y="96" width="130" height="64" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="124" fill="#cfd5dd" font-size="14">Application</text>
  <text x="40" y="146" fill="#a3abb8" font-size="14">no region code</text>

  <rect x="190" y="96" width="196" height="64" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="206" y="124" fill="#cfd5dd" font-size="14">Gateway</text>
  <text x="206" y="146" fill="#a3abb8" font-size="14">class + approved regions</text>

  <line x1="154" y1="128" x2="188" y2="128" stroke="#35d399" stroke-width="2"/>

  <rect x="430" y="88" width="186" height="48" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="446" y="117" fill="#cfd5dd" font-size="14">EU key: eligible</text>
  <rect x="430" y="148" width="186" height="48" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="446" y="177" fill="#cfd5dd" font-size="14">Global key: dropped</text>
  <line x1="386" y1="116" x2="428" y2="112" stroke="#35d399" stroke-width="2"/>
  <line x1="386" y1="140" x2="428" y2="172" stroke="#f0b429" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="24" y="226" width="592" height="80" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="254" fill="#cfd5dd" font-size="14">If the EU key is unhealthy, the request fails with a clear 446 refusal.</text>
  <text x="40" y="278" fill="#cfd5dd" font-size="14">It never falls back to a key outside the approved regions.</text>
  <text x="40" y="298" fill="#a3abb8" font-size="14">Storage region and inference region are separate questions.</text>
</svg>
