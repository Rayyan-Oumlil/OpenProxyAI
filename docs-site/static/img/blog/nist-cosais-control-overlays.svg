<rect x="362" y="194" width="254" height="50" rx="9" fill="#14171e" stroke="#35d399" stroke-width="1.5"/>
<text x="489.0" y="224.0" font-size="14" text-anchor="middle" fill="#cfd5dd">One audit trail, every call</text>
</svg>