<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Access versus control</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Two different jobs. Many teams need both.</text>

  <text x="24" y="98" fill="#a3abb8" font-size="14">Hosted router: access</text>
  <rect x="24" y="108" width="280" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="36" y="135" fill="#cfd5dd" font-size="14">Your app, one API key</text>
  <line x1="164" y1="152" x2="164" y2="172" stroke="#cfd5dd" stroke-width="2"/>
  <rect x="24" y="172" width="280" height="62" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="36" y="196" fill="#f4f6f8" font-size="14" font-weight="600">Router run by a vendor</text>
  <text x="36" y="218" fill="#cfd5dd" font-size="14">One endpoint, many models</text>
  <line x1="164" y1="234" x2="164" y2="254" stroke="#cfd5dd" stroke-width="2"/>
  <rect x="24" y="254" width="280" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="36" y="281" fill="#cfd5dd" font-size="14">Model providers</text>

  <text x="336" y="98" fill="#a3abb8" font-size="14">Self-hosted gateway: control</text>
  <rect x="336" y="108" width="280" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="348" y="135" fill="#cfd5dd" font-size="14">Your app, one gateway key</text>
  <line x1="476" y1="152" x2="476" y2="172" stroke="#cfd5dd" stroke-width="2"/>
  <rect x="336" y="172" width="280" height="62" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="348" y="196" fill="#f4f6f8" font-size="14" font-weight="600">Gateway in your network</text>
  <text x="348" y="218" fill="#cfd5dd" font-size="14">Policy, budgets, audit log</text>
  <line x1="476" y1="234" x2="476" y2="254" stroke="#cfd5dd" stroke-width="2"/>
  <rect x="336" y="254" width="280" height="44" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="348" y="281" fill="#cfd5dd" font-size="14">Providers, local models</text>
</svg>
