<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="300" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">A stream is an open connection</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Python SDK, sync and async</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3abb8"/></marker></defs>
  <rect x="24" y="90" width="130" height="64" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="89" y="118" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">SDK request</text>
  <text x="89" y="138" fill="#a3abb8" font-size="14" text-anchor="middle">stream=True</text>
  <rect x="254" y="90" width="190" height="64" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="349" y="118" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">Open connection</text>
  <text x="349" y="138" fill="#a3abb8" font-size="14" text-anchor="middle">chunks arrive over time</text>
  <rect x="504" y="90" width="112" height="64" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="560" y="118" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">Your app</text>
  <text x="560" y="138" fill="#a3abb8" font-size="14" text-anchor="middle">token by token</text>
  <line x1="154" y1="122" x2="250" y2="122" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="444" y1="122" x2="500" y2="122" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="24" y="200" fill="#cfd5dd" font-size="14">The stream object owns the connection.</text>
  <text x="24" y="224" fill="#cfd5dd" font-size="14">One reader, one pass, every chunk delivered.</text>
  <text x="24" y="248" fill="#cfd5dd" font-size="14">The connection closes when iteration ends.</text>
  <text x="24" y="272" fill="#cfd5dd" font-size="14">Refusals arrive as typed errors, before the first chunk.</text>
</svg>
