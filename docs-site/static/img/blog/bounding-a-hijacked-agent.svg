<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" role="img" aria-labelledby="t d">
  <title id="t">Four caps around a hijacked agent</title>
  <desc id="d">An agent is assumed hijacked. Spend caps above it, tool reach on its left, calls per minute on its right, and side-effect tools blocked after untrusted output below it.</desc>
  <rect x="0.5" y="0.5" width="639" height="449" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">
    <text x="24" y="36" font-size="20" font-weight="600" fill="#f4f6f8">Four caps around an agent you assume is hijacked</text>

    <rect x="170" y="56" width="300" height="84" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="186" y="82" font-weight="600" fill="#f4f6f8">Spend</text>
    <text x="186" y="104" fill="#a3abb8">Daily org and user budget,</text>
    <text x="186" y="124" fill="#a3abb8">monthly team budget: 429</text>

    <rect x="16" y="176" width="200" height="104" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="30" y="202" font-weight="600" fill="#f4f6f8">Tools reachable</text>
    <text x="30" y="224" fill="#a3abb8">Grants, bundles, pins</text>
    <text x="30" y="244" fill="#a3abb8">Codes -32001, -32004</text>

    <rect x="256" y="196" width="128" height="64" rx="10" fill="#14171e" stroke="#35d399" stroke-width="2"/>
    <text x="320" y="224" text-anchor="middle" font-weight="600" fill="#f4f6f8">Agent</text>
    <text x="320" y="246" text-anchor="middle" fill="#f0b429">assume hijacked</text>

    <rect x="424" y="176" width="200" height="104" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="438" y="202" font-weight="600" fill="#f4f6f8">Calls per minute</text>
    <text x="438" y="224" fill="#a3abb8">MCP: 120 per key</text>
    <text x="438" y="244" fill="#a3abb8">Model: org, team limits</text>

    <rect x="170" y="316" width="300" height="84" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="186" y="342" font-weight="600" fill="#f4f6f8">Side effects</text>
    <text x="186" y="364" fill="#a3abb8">Sink tools refuse to run once</text>
    <text x="186" y="384" fill="#a3abb8">untrusted output was seen: -32009</text>

    <g stroke="#35d399" stroke-width="2" fill="none">
      <path d="M320 140 L320 192"/>
      <path d="M216 228 L252 228"/>
      <path d="M388 228 L424 228"/>
      <path d="M320 264 L320 316"/>
    </g>

    <text x="24" y="430" fill="#a3abb8">None of these detect an injection. They cap what it can do.</text>
  </g>
</svg>
