<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" role="img" aria-label="Request path for a batch line, eval run or conversation turn. The provider answers, then the gateway tries to price the call. Old behavior: pricing fails and the answer is dropped with a 502. New behavior: the answer is kept, a flat fee is charged and the log row is marked cost_estimated.">
  <rect x="1" y="1" width="638" height="358" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
  <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#f4f6f8">When the price lookup fails</text>

  <rect x="24" y="64" width="130" height="48" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="38" y="93" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Provider call</text>
  <rect x="254" y="64" width="130" height="48" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="268" y="93" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Price the call</text>
  <rect x="484" y="64" width="132" height="48" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="498" y="93" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Audit log</text>
  <line x1="154" y1="88" x2="252" y2="88" stroke="#a3abb8" stroke-width="2"/>
  <line x1="384" y1="88" x2="482" y2="88" stroke="#a3abb8" stroke-width="2"/>
  <text x="24" y="136" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#a3abb8">The provider has already answered and already charged.</text>

  <text x="24" y="172" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f0b429">Before</text>
  <rect x="24" y="184" width="592" height="56" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="38" y="208" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Pricing raises, so the call is treated as failed.</text>
  <text x="38" y="228" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Row logged as 502, answer thrown away, line fails.</text>

  <text x="24" y="270" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#35d399">After</text>
  <rect x="24" y="282" width="592" height="56" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="38" y="306" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Flat fee charged, answer returned, row logged as 200.</text>
  <text x="38" y="326" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">Metadata carries cost_estimated, spend counters still move.</text>
</svg>
