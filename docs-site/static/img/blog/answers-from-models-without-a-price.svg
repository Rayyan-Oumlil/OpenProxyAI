<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="280" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="279" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">A model with no listed price</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">The answer is never lost</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3abb8"/></marker></defs>
  <rect x="24" y="92" width="170" height="64" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="109" y="120" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">Provider call</text>
  <text x="109" y="140" fill="#a3abb8" font-size="14" text-anchor="middle">answer returned</text>
  <rect x="235" y="92" width="170" height="64" rx="10" fill="#241c08" stroke="#f0b429"/>
  <text x="320" y="120" fill="#f0b429" font-size="15" font-weight="600" text-anchor="middle">Flat fee</text>
  <text x="320" y="140" fill="#cfd5dd" font-size="14" text-anchor="middle">flagged as estimate</text>
  <rect x="446" y="92" width="170" height="64" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="531" y="120" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">Audit log</text>
  <text x="531" y="140" fill="#a3abb8" font-size="14" text-anchor="middle">logged as success</text>
  <line x1="194" y1="124" x2="231" y2="124" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="405" y1="124" x2="442" y2="124" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="24" y="200" fill="#cfd5dd" font-size="14">The caller gets the answer.</text>
  <text x="24" y="224" fill="#cfd5dd" font-size="14">Spend counters still move, so budgets keep working.</text>
  <text x="24" y="248" fill="#cfd5dd" font-size="14">The estimate is marked, so you can tell it from an exact cost.</text>
</svg>
