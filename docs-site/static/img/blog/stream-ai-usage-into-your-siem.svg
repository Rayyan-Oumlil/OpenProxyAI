<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">AI activity, in the tools you already run</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Two optional streams, no content inside</text>

  <rect x="24" y="90" width="172" height="124" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="40" y="116" fill="#35d399" font-size="14" font-weight="600">Gateway</text>
  <text x="40" y="142" fill="#cfd5dd" font-size="14">Every model call</text>
  <text x="40" y="162" fill="#cfd5dd" font-size="14">Every block or stop</text>
  <text x="40" y="182" fill="#cfd5dd" font-size="14">Sent in background</text>

  <rect x="304" y="90" width="172" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="320" y="114" fill="#f4f6f8" font-size="14" font-weight="600">Trace span per call</text>
  <text x="320" y="132" fill="#a3abb8" font-size="14">Cost, tokens, latency</text>

  <rect x="304" y="162" width="172" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="320" y="186" fill="#f4f6f8" font-size="14" font-weight="600">Security event</text>
  <text x="320" y="204" fill="#a3abb8" font-size="14">CEF or JSON</text>

  <rect x="512" y="90" width="104" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="528" y="121" fill="#cfd5dd" font-size="14">Collector</text>

  <rect x="512" y="162" width="104" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="528" y="193" fill="#cfd5dd" font-size="14">SIEM</text>

  <line x1="196" y1="116" x2="302" y2="116" stroke="#a3abb8" stroke-width="2"/>
  <line x1="196" y1="188" x2="302" y2="188" stroke="#a3abb8" stroke-width="2"/>
  <line x1="476" y1="116" x2="510" y2="116" stroke="#a3abb8" stroke-width="2"/>
  <line x1="476" y1="188" x2="510" y2="188" stroke="#a3abb8" stroke-width="2"/>

  <rect x="24" y="240" width="592" height="64" rx="10" fill="#1d1710" stroke="#f0b429"/>
  <text x="40" y="266" fill="#f0b429" font-size="14" font-weight="600">A slow collector never slows a request</text>
  <text x="40" y="288" fill="#cfd5dd" font-size="14">Prompts, completions and tool arguments are never exported.</text>
