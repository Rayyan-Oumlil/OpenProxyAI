<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" role="img" aria-labelledby="t d">
  <title id="t">From the standard's topics to gateway evidence</title>
  <desc id="d">Four topics from EN 18286 on the left, each paired with the record a gateway produces on the right.</desc>
  <rect x="0.5" y="0.5" width="639" height="379" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">
    <text x="24" y="36" font-size="20" font-weight="600" fill="#f4f6f8">From the standard to the evidence</text>
    <text x="24" y="66" font-weight="600" fill="#a3abb8">EN 18286 topic</text>
    <text x="360" y="66" font-weight="600" fill="#a3abb8">Record from the gateway</text>

    <rect x="24" y="80" width="250" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="111" fill="#f4f6f8">Requirements and scope</text>
    <rect x="360" y="80" width="256" height="52" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="376" y="111" fill="#f4f6f8">Model and provider inventory</text>

    <rect x="24" y="148" width="250" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="179" fill="#f4f6f8">Supply chain controls</text>
    <rect x="360" y="148" width="256" height="52" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="376" y="179" fill="#f4f6f8">Allowed models, data routing</text>

    <rect x="24" y="216" width="250" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="247" fill="#f4f6f8">Post-market monitoring</text>
    <rect x="360" y="216" width="256" height="52" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="376" y="247" fill="#f4f6f8">Request log and analytics</text>

    <rect x="24" y="284" width="250" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="315" fill="#f4f6f8">Incident reporting</text>
    <rect x="360" y="284" width="256" height="52" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="376" y="315" fill="#f4f6f8">Policy exports, admin audit log</text>

    <g stroke="#35d399" stroke-width="2" fill="none">
      <path d="M274 106 L356 106"/>
      <path d="M274 174 L356 174"/>
      <path d="M274 242 L356 242"/>
      <path d="M274 310 L356 310"/>
    </g>
    <text x="24" y="364" fill="#a3abb8">Records support a quality system. They do not replace one.</text>
  </g>
</svg>
