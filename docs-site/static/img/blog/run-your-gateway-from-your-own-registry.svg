<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" role="img" aria-labelledby="t d">
  <title id="t">Upgrade from your own registry</title>
  <desc id="d">A release is mirrored into your internal registry, pinned by digest, tested in staging, then promoted to production.</desc>
  <rect x="0.5" y="0.5" width="639" height="299" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">
    <text x="24" y="36" font-size="20" font-weight="600" fill="#f4f6f8">Upgrade when you decide</text>
    <rect x="16" y="84" width="130" height="90" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="30" y="112" font-weight="600" fill="#f4f6f8">Release</text>
    <text x="30" y="136" fill="#a3abb8">Notes read,</text>
    <text x="30" y="156" fill="#a3abb8">version chosen</text>
    <rect x="170" y="84" width="130" height="90" rx="10" fill="#14171e" stroke="#35d399" stroke-width="2"/>
    <text x="184" y="112" font-weight="600" fill="#f4f6f8">Your registry</text>
    <text x="184" y="136" fill="#a3abb8">Mirrored,</text>
    <text x="184" y="156" fill="#a3abb8">digest saved</text>
    <rect x="324" y="84" width="130" height="90" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="338" y="112" font-weight="600" fill="#f4f6f8">Staging</text>
    <text x="338" y="136" fill="#a3abb8">Same digest,</text>
    <text x="338" y="156" fill="#a3abb8">checks pass</text>
    <rect x="478" y="84" width="146" height="90" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="492" y="112" font-weight="600" fill="#f4f6f8">Production</text>
    <text x="492" y="136" fill="#a3abb8">Promoted, old</text>
    <text x="492" y="156" fill="#a3abb8">digest kept</text>
    <g stroke="#35d399" stroke-width="2" fill="none">
      <path d="M146 129 L166 129"/>
      <path d="M300 129 L320 129"/>
      <path d="M454 129 L474 129"/>
    </g>
    <text x="24" y="226" fill="#f0b429" font-weight="600">Back up the database before promoting.</text>
    <text x="24" y="262" fill="#a3abb8">No moving tags, no surprise changes at restart.</text>
  </g>
</svg>
