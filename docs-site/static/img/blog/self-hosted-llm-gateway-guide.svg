<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="320" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="319" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">A self-hosted LLM gateway</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">One front door, running in your network, for every model.</text>

  <rect x="24" y="84" width="592" height="196" rx="10" fill="none" stroke="#35d399" stroke-dasharray="5 5"/>
  <text x="38" y="106" fill="#35d399" font-size="14">Your network</text>

  <rect x="40" y="124" width="140" height="130" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="54" y="150" fill="#cfd5dd" font-size="14">Your apps</text>
  <text x="54" y="176" fill="#a3abb8" font-size="14">Existing OpenAI</text>
  <text x="54" y="196" fill="#a3abb8" font-size="14">SDK code, one</text>
  <text x="54" y="216" fill="#a3abb8" font-size="14">changed base URL</text>

  <rect x="230" y="124" width="190" height="130" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="244" y="150" fill="#f4f6f8" font-size="14" font-weight="600">Gateway</text>
  <text x="244" y="174" fill="#cfd5dd" font-size="14">Policy checks</text>
  <text x="244" y="194" fill="#cfd5dd" font-size="14">Budgets and limits</text>
  <text x="244" y="214" fill="#cfd5dd" font-size="14">Caching and failover</text>
  <text x="244" y="234" fill="#cfd5dd" font-size="14">Audit log</text>

  <rect x="470" y="124" width="130" height="56" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="484" y="148" fill="#cfd5dd" font-size="14">Local model</text>
  <text x="484" y="168" fill="#a3abb8" font-size="14">stays inside</text>

  <rect x="470" y="198" width="130" height="56" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="484" y="222" fill="#cfd5dd" font-size="14">Cloud models</text>
  <text x="484" y="242" fill="#f0b429" font-size="14">your own keys</text>

  <line x1="180" y1="189" x2="230" y2="189" stroke="#cfd5dd" stroke-width="2"/>
  <line x1="420" y1="152" x2="470" y2="152" stroke="#35d399" stroke-width="2"/>
  <line x1="420" y1="226" x2="470" y2="226" stroke="#f0b429" stroke-width="2"/>

  <text x="24" y="304" fill="#a3abb8" font-size="14">Prompts, keys and logs stay under your control.</text>
</svg>
