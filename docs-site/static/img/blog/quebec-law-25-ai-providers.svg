<line x1="321" y1="138" x2="321" y2="162" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="226" y="166" width="190" height="56" rx="9" fill="#14171e" stroke="#f0b429" stroke-width="1.5"/>
<text x="321.0" y="199.0" font-size="14" text-anchor="middle" fill="#cfd5dd">Clear refusal</text>
</svg>