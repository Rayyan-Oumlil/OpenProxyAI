<text x="109.0" y="94.5" font-size="14" text-anchor="middle" fill="#f4f6f8" font-weight="600">Prompt</text>
<text x="109.0" y="113.5" font-size="14" text-anchor="middle" fill="#cfd5dd">may hold personal info</text>
<line x1="198" y1="99" x2="222" y2="99" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
