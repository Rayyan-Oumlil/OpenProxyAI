<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="A prompt that may hold personal information gets a data class, then the model registry checks class and region. The request goes to an approved provider or is refused with a clear reason." font-family="Inter, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3abb8"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="249" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
