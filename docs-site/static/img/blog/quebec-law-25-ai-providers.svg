<text x="321.0" y="94.5" font-size="14" text-anchor="middle" fill="#f4f6f8" font-weight="600">Data class</text>
<text x="321.0" y="113.5" font-size="14" text-anchor="middle" fill="#cfd5dd">set for the request</text>
<line x1="420" y1="99" x2="444" y2="99" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="448" y="64" width="168" height="70" rx="9" fill="#14171e" stroke="#35d399" stroke-width="1.5"/>
<text x="532.0" y="94.5" font-size="14" text-anchor="middle" fill="#f4f6f8" font-weight="600">Registry</text>
<text x="532.0" y="113.5" font-size="14" text-anchor="middle" fill="#cfd5dd">class and region</text>
<line x1="532" y1="138" x2="532" y2="162" stroke="#a3abb8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="448" y="166" width="168" height="56" rx="9" fill="#14171e" stroke="#2a2f3a" stroke-width="1"/>
