<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="310" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="309" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">One provider, still five reasons</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">What a gateway gives you on day one.</text>

  <rect x="24" y="88" width="130" height="190" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="36" y="116" fill="#f4f6f8" font-size="14" font-weight="600">Your apps</text>
  <text x="36" y="142" fill="#cfd5dd" font-size="14">Gateway key</text>
  <text x="36" y="164" fill="#cfd5dd" font-size="14">per app or team</text>

  <rect x="190" y="88" width="270" height="190" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="202" y="116" fill="#f4f6f8" font-size="14" font-weight="600">Gateway</text>
  <text x="202" y="142" fill="#cfd5dd" font-size="14">1. Policy on every request</text>
  <text x="202" y="164" fill="#cfd5dd" font-size="14">2. Provider key kept in one place</text>
  <text x="202" y="186" fill="#cfd5dd" font-size="14">3. Budgets and cost by team</text>
  <text x="202" y="208" fill="#cfd5dd" font-size="14">4. Audit log of every call</text>
  <text x="202" y="230" fill="#cfd5dd" font-size="14">5. Ready to switch models later</text>

  <rect x="496" y="88" width="120" height="86" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="508" y="116" fill="#f4f6f8" font-size="14" font-weight="600">Provider</text>
  <text x="508" y="142" fill="#cfd5dd" font-size="14">your only one</text>

  <rect x="496" y="192" width="120" height="86" rx="8" fill="none" stroke="#f0b429" stroke-dasharray="4 4"/>
  <text x="508" y="220" fill="#a3abb8" font-size="14">Later, maybe</text>
  <text x="508" y="242" fill="#a3abb8" font-size="14">a second</text>

  <line x1="154" y1="183" x2="190" y2="183" stroke="#cfd5dd" stroke-width="2"/>
  <line x1="460" y1="131" x2="496" y2="131" stroke="#cfd5dd" stroke-width="2"/>
  <line x1="460" y1="235" x2="496" y2="235" stroke="#f0b429" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
