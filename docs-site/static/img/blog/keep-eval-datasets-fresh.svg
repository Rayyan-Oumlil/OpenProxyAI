<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="300" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">A test set that follows your traffic</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Refresh it on a schedule, score it the same way every time</text>

  <rect x="24" y="88" width="164" height="104" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="114" fill="#f4f6f8" font-size="14" font-weight="600">Captured sample</text>
  <text x="40" y="140" fill="#cfd5dd" font-size="14">Redacted, opt-in</text>
  <text x="40" y="164" fill="#cfd5dd" font-size="14">Ratings attached</text>

  <line x1="188" y1="140" x2="226" y2="140" stroke="#35d399" stroke-width="2"/>
  <polygon points="226,134 238,140 226,146" fill="#35d399"/>

  <rect x="238" y="88" width="164" height="104" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="254" y="114" fill="#35d399" font-size="14" font-weight="600">Rolling dataset</text>
  <text x="254" y="140" fill="#cfd5dd" font-size="14">Recent traffic</text>
  <text x="254" y="164" fill="#cfd5dd" font-size="14">Duplicates skipped</text>

  <line x1="402" y1="140" x2="440" y2="140" stroke="#35d399" stroke-width="2"/>
  <polygon points="440,134 452,140 440,146" fill="#35d399"/>

  <rect x="452" y="88" width="164" height="104" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="468" y="114" fill="#f4f6f8" font-size="14" font-weight="600">Eval run</text>
  <text x="468" y="140" fill="#cfd5dd" font-size="14">Same scorer</text>
  <text x="468" y="164" fill="#cfd5dd" font-size="14">With a cost cap</text>

  <rect x="24" y="216" width="592" height="62" rx="10" fill="#1d1710" stroke="#f0b429"/>
  <text x="40" y="242" fill="#f0b429" font-size="14" font-weight="600">Keep two sets</text>
  <text x="40" y="264" fill="#cfd5dd" font-size="14">A frozen one to compare over time, a rolling one for current traffic.</text>
</svg>
