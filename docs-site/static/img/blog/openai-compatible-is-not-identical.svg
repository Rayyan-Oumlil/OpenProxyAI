<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Compatible is not identical</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">The gateway keeps one shape for your app.</text>

  <rect x="24" y="92" width="150" height="206" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="36" y="120" fill="#f4f6f8" font-size="14" font-weight="600">Your app</text>
  <text x="36" y="146" fill="#cfd5dd" font-size="14">One request</text>
  <text x="36" y="168" fill="#cfd5dd" font-size="14">shape, one</text>
  <text x="36" y="190" fill="#cfd5dd" font-size="14">response shape,</text>
  <text x="36" y="212" fill="#cfd5dd" font-size="14">one error model</text>

  <rect x="214" y="92" width="212" height="206" rx="8" fill="#14171e" stroke="#35d399"/>
  <text x="226" y="120" fill="#f4f6f8" font-size="14" font-weight="600">Gateway smooths</text>
  <text x="226" y="146" fill="#cfd5dd" font-size="14">Provider and model name</text>
  <text x="226" y="168" fill="#cfd5dd" font-size="14">Tool calls pass through</text>
  <text x="226" y="190" fill="#cfd5dd" font-size="14">Streaming chunks</text>
  <text x="226" y="212" fill="#cfd5dd" font-size="14">Usage and cost on streams</text>
  <text x="226" y="234" fill="#cfd5dd" font-size="14">Behavior settings</text>
  <text x="226" y="256" fill="#cfd5dd" font-size="14">Who said no, in headers</text>

  <rect x="466" y="92" width="150" height="54" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="478" y="124" fill="#cfd5dd" font-size="14">Provider A</text>
  <rect x="466" y="160" width="150" height="54" rx="8" fill="#14171e" stroke="#2a2f3a"/>
  <text x="478" y="192" fill="#cfd5dd" font-size="14">Provider B</text>
  <rect x="466" y="228" width="150" height="70" rx="8" fill="#14171e" stroke="#f0b429"/>
  <text x="478" y="256" fill="#cfd5dd" font-size="14">Details differ</text>
  <text x="478" y="278" fill="#a3abb8" font-size="14">per provider</text>

  <line x1="174" y1="195" x2="214" y2="195" stroke="#cfd5dd" stroke-width="2"/>
  <line x1="426" y1="150" x2="466" y2="119" stroke="#cfd5dd" stroke-width="2"/>
  <line x1="426" y1="195" x2="466" y2="187" stroke="#cfd5dd" stroke-width="2"/>
  <line x1="426" y1="240" x2="466" y2="260" stroke="#f0b429" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
