<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="372" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="371" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Eight questions for any gateway</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Ask for a demo of each, not a document.</text>

  <rect x="24" y="80" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="102" fill="#35d399" font-size="14" font-weight="600">1  Policy before the call</text>
  <text x="40" y="122" fill="#cfd5dd" font-size="14">Blocked before any provider</text>

  <rect x="324" y="80" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="340" y="102" fill="#35d399" font-size="14" font-weight="600">2  Budgets and limits</text>
  <text x="340" y="122" fill="#cfd5dd" font-size="14">Per team, checked up front</text>

  <rect x="24" y="144" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="166" fill="#35d399" font-size="14" font-weight="600">3  Data-class routing</text>
  <text x="40" y="186" fill="#cfd5dd" font-size="14">Which model sees which data</text>

  <rect x="324" y="144" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="340" y="166" fill="#35d399" font-size="14" font-weight="600">4  Audit and retention</text>
  <text x="340" y="186" fill="#cfd5dd" font-size="14">Evidence you can export</text>

  <rect x="24" y="208" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="230" fill="#35d399" font-size="14" font-weight="600">5  SSO and SCIM</text>
  <text x="40" y="250" fill="#cfd5dd" font-size="14">Access follows your IdP</text>

  <rect x="324" y="208" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="340" y="230" fill="#35d399" font-size="14" font-weight="600">6  Admin console</text>
  <text x="340" y="250" fill="#cfd5dd" font-size="14">Non-engineers can operate it</text>

  <rect x="24" y="272" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="294" fill="#35d399" font-size="14" font-weight="600">7  Tool governance</text>
  <text x="40" y="314" fill="#cfd5dd" font-size="14">Grants for MCP tools</text>

  <rect x="324" y="272" width="292" height="52" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="340" y="294" fill="#35d399" font-size="14" font-weight="600">8  Deployment and licence</text>
  <text x="340" y="314" fill="#cfd5dd" font-size="14">Where it runs, what you may do</text>

  <rect x="24" y="334" width="592" height="28" rx="8" fill="#1d1710" stroke="#f0b429"/>
  <text x="40" y="353" fill="#f0b429" font-size="14" font-weight="600">Score each: shown, partly shown, or only claimed</text>
</svg>
