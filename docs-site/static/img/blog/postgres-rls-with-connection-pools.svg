<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="320" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="319" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">One shared connection, scoped per request</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">The organization scope lives only inside a transaction</text>
  <rect x="24" y="90" width="184" height="120" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="116" y="120" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">Request 1</text>
  <text x="116" y="148" fill="#cfd5dd" font-size="14" text-anchor="middle">Scoped to org A</text>
  <text x="116" y="172" fill="#a3abb8" font-size="14" text-anchor="middle">Sees A rows only</text>
  <text x="116" y="196" fill="#a3abb8" font-size="14" text-anchor="middle">Scope ends at commit</text>
  <rect x="228" y="90" width="184" height="120" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="320" y="120" fill="#f4f6f8" font-size="15" font-weight="600" text-anchor="middle">Request 2</text>
  <text x="320" y="148" fill="#cfd5dd" font-size="14" text-anchor="middle">Scoped to org B</text>
  <text x="320" y="172" fill="#a3abb8" font-size="14" text-anchor="middle">Sees B rows only</text>
  <text x="320" y="196" fill="#a3abb8" font-size="14" text-anchor="middle">Scope ends at commit</text>
  <rect x="432" y="90" width="184" height="120" rx="10" fill="#241c08" stroke="#f0b429"/>
  <text x="524" y="120" fill="#f0b429" font-size="15" font-weight="600" text-anchor="middle">No scope set</text>
  <text x="524" y="148" fill="#cfd5dd" font-size="14" text-anchor="middle">Sees nothing</text>
  <text x="524" y="172" fill="#a3abb8" font-size="14" text-anchor="middle">Writes are refused</text>
  <text x="524" y="196" fill="#a3abb8" font-size="14" text-anchor="middle">Fails closed</text>
  <text x="24" y="252" fill="#cfd5dd" font-size="14">Enforced by the database, not by application code.</text>
  <text x="24" y="276" fill="#a3abb8" font-size="14">Nothing carries over from one request to the next.</text>
</svg>
