<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="340" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="339" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Four classes, one ladder</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">A model may see a class only if its clearance is high enough</text>
  <rect x="24" y="84" width="592" height="44" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="44" y="112" fill="#f4f6f8" font-size="15" font-weight="600">secret</text>
  <text x="200" y="112" fill="#cfd5dd" font-size="14">Draft merger papers</text>
  <rect x="24" y="138" width="592" height="44" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="44" y="166" fill="#f4f6f8" font-size="15" font-weight="600">confidential</text>
  <text x="200" y="166" fill="#cfd5dd" font-size="14">Card numbers, SSNs, unreadable audio</text>
  <rect x="24" y="192" width="592" height="44" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="44" y="220" fill="#f4f6f8" font-size="15" font-weight="600">internal</text>
  <text x="200" y="220" fill="#cfd5dd" font-size="14">Email addresses, internal notes</text>
  <rect x="24" y="246" width="592" height="44" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="44" y="274" fill="#f4f6f8" font-size="15" font-weight="600">public</text>
  <text x="200" y="274" fill="#cfd5dd" font-size="14">Anything safe to share</text>
  <text x="24" y="318" fill="#a3abb8" font-size="14">Callers can raise a class, never lower it.</text>
</svg>
