<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="450" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="449" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Four classes, one ladder</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">A model may see a class only if its clearance is at least that rank</text>

  <g font-size="14">
    <text x="24" y="96" fill="#a3abb8">Class and example data</text>
    <text x="400" y="96" fill="#a3abb8">Models that may see it</text>

    <rect x="24" y="108" width="352" height="60" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="132" fill="#f4f6f8" font-weight="600">3  secret</text>
    <text x="40" y="154" fill="#cfd5dd">Draft merger papers (header only)</text>
    <rect x="400" y="108" width="216" height="60" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="416" y="143" fill="#35d399" font-weight="600">Cleared for secret only</text>

    <rect x="24" y="180" width="352" height="60" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="204" fill="#f4f6f8" font-weight="600">2  confidential</text>
    <text x="40" y="226" fill="#cfd5dd">Card numbers, SSNs, unreadable audio</text>
    <rect x="400" y="180" width="216" height="60" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="416" y="215" fill="#35d399" font-weight="600">Cleared for confidential+</text>

    <rect x="24" y="252" width="352" height="60" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="276" fill="#f4f6f8" font-weight="600">1  internal (default floor)</text>
    <text x="40" y="298" fill="#cfd5dd">Email addresses, internal notes</text>
    <rect x="400" y="252" width="216" height="60" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="416" y="287" fill="#35d399" font-weight="600">Cleared for internal+</text>

    <rect x="24" y="324" width="352" height="60" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="348" fill="#f4f6f8" font-weight="600">0  public</text>
    <text x="40" y="370" fill="#cfd5dd">Only if the org default is set to public</text>
    <rect x="400" y="324" width="216" height="60" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="416" y="359" fill="#35d399" font-weight="600">Any cleared model</text>
  </g>

  <rect x="24" y="396" width="592" height="38" rx="10" fill="#1d1710" stroke="#f0b429"/>
  <text x="40" y="420" fill="#f0b429" font-size="14" font-weight="600">Clearance = lower of model and key class. Callers raise, never lower.</text>
</svg>
