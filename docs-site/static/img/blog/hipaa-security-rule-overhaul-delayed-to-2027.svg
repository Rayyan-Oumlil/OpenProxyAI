<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="380" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="379" rx="11.5" fill="none" stroke="#1b1f27"/>
