<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Request path from your app through your gateway to a provider, with what the gateway keeps and what the provider keeps shown as two separate cards" font-family="Inter, system-ui, sans-serif">
  <rect x="1" y="1" width="638" height="298" rx="16" fill="#0d0f14" stroke="#1b1f27" stroke-width="2"/>
  <text x="24" y="38" font-size="20" font-weight="600" fill="#f4f6f8">Two places data can be kept</text>
  <rect x="24" y="60" width="130" height="64" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="89" y="97" font-size="14" fill="#cfd5dd" text-anchor="middle">Your app</text>
  <rect x="225" y="60" width="190" height="64" rx="10" fill="#14171e" stroke="#35d399" stroke-width="2"/>
  <text x="320" y="87" font-size="14" font-weight="600" fill="#f4f6f8" text-anchor="middle">Your gateway</text>
  <text x="320" y="108" font-size="14" fill="#a3abb8" text-anchor="middle">metadata only by default</text>
  <rect x="486" y="60" width="130" height="64" rx="10" fill="#14171e" stroke="#f0b429" stroke-width="2"/>
  <text x="551" y="87" font-size="14" font-weight="600" fill="#f4f6f8" text-anchor="middle">Provider</text>
  <text x="551" y="108" font-size="14" fill="#a3abb8" text-anchor="middle">your agreement</text>
  <path d="M154 92 H219" stroke="#a3abb8" stroke-width="2"/>
  <polygon points="219,87 225,92 219,97" fill="#a3abb8"/>
  <path d="M415 92 H480" stroke="#a3abb8" stroke-width="2"/>
  <polygon points="480,87 486,92 480,97" fill="#a3abb8"/>
  <rect x="24" y="152" width="292" height="124" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="180" font-size="14" font-weight="600" fill="#35d399">Kept by the gateway</text>
  <text x="40" y="206" font-size="14" fill="#cfd5dd">Model, tokens, cost, status</text>
  <text x="40" y="228" font-size="14" fill="#cfd5dd">Opt-in redacted samples</text>
  <text x="40" y="250" font-size="14" fill="#cfd5dd">Expiry follows your plan</text>
  <rect x="324" y="152" width="292" height="124" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="340" y="180" font-size="14" font-weight="600" fill="#f0b429">Kept by the provider</text>
  <text x="340" y="206" font-size="14" fill="#cfd5dd">Set by your agreement</text>
  <text x="340" y="228" font-size="14" fill="#cfd5dd">Separate from the gateway</text>
  <text x="340" y="250" font-size="14" fill="#cfd5dd">Check it before you route</text>
</svg>
