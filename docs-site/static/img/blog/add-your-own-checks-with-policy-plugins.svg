<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Your rule, behind the built-in checks</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">A plugin can add a block, never remove one</text>

  <rect x="24" y="90" width="172" height="124" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="40" y="116" fill="#f4f6f8" font-size="14" font-weight="600">Request</text>
  <text x="40" y="142" fill="#cfd5dd" font-size="14">Text of the call</text>
  <text x="40" y="162" fill="#cfd5dd" font-size="14">Any endpoint</text>

  <rect x="234" y="90" width="172" height="124" rx="10" fill="#14171e" stroke="#2a2f3a"/>
  <text x="250" y="116" fill="#f4f6f8" font-size="14" font-weight="600">Built-in policy</text>
  <text x="250" y="142" fill="#cfd5dd" font-size="14">Models, keywords</text>
  <text x="250" y="162" fill="#cfd5dd" font-size="14">Personal data</text>
  <text x="250" y="182" fill="#cfd5dd" font-size="14">Injection</text>

  <rect x="444" y="90" width="172" height="124" rx="10" fill="#14171e" stroke="#35d399"/>
  <text x="460" y="116" fill="#35d399" font-size="14" font-weight="600">Your plugin</text>
  <text x="460" y="142" fill="#cfd5dd" font-size="14">Sandboxed module</text>
  <text x="460" y="162" fill="#cfd5dd" font-size="14">Allow or block</text>
  <text x="460" y="182" fill="#cfd5dd" font-size="14">Fails closed</text>

  <line x1="196" y1="152" x2="232" y2="152" stroke="#a3abb8" stroke-width="2"/>
  <line x1="406" y1="152" x2="442" y2="152" stroke="#a3abb8" stroke-width="2"/>

  <rect x="24" y="240" width="592" height="64" rx="10" fill="#1d1710" stroke="#f0b429"/>
  <text x="40" y="266" fill="#f0b429" font-size="14" font-weight="600">A hit is a normal policy block</text>
  <text x="40" y="288" fill="#cfd5dd" font-size="14">Status 446, named after the plugin, recorded in the audit log.</text>
