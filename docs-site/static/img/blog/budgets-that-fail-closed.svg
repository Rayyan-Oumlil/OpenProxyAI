  <text x="24" y="64" fill="#a3abb8" font-size="14">Illustrative curve</text>
  <line x1="60" y1="90" x2="60" y2="290" stroke="#2a2f3a"/>
  <line x1="60" y1="290" x2="616" y2="290" stroke="#2a2f3a"/>
  <line x1="60" y1="110" x2="616" y2="110" stroke="#35d399" stroke-dasharray="6 4"/>
