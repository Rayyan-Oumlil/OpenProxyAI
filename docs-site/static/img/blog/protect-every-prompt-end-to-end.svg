<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="430" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="429" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">One request, seven checkpoints</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">Each stage can stop the request or record what happened</text>
  <g font-size="14">
    <rect x="24" y="80" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="105" fill="#35d399" font-weight="600">1  Key</text>
    <text x="170" y="105" fill="#cfd5dd">Who is calling? Unknown keys stop here</text>
    <rect x="24" y="128" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="153" fill="#35d399" font-weight="600">2  Limits</text>
    <text x="170" y="153" fill="#cfd5dd">Requests, tokens and dollars, per org, team, user</text>
    <rect x="24" y="176" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="201" fill="#35d399" font-weight="600">3  Policy</text>
    <text x="170" y="201" fill="#cfd5dd">Model list, blocked words, personal data, injection</text>
    <rect x="24" y="224" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="249" fill="#f0b429" font-weight="600">4  Cache</text>
    <text x="170" y="249" fill="#cfd5dd">A stored answer skips the provider call</text>
    <rect x="24" y="272" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="297" fill="#35d399" font-weight="600">5  Route</text>
    <text x="170" y="297" fill="#cfd5dd">A model cleared for the data, with failover</text>
    <rect x="24" y="320" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="345" fill="#35d399" font-weight="600">6  Response</text>
    <text x="170" y="345" fill="#cfd5dd">Optional checks on what the model sends back</text>
    <rect x="24" y="368" width="592" height="40" rx="8" fill="#14171e" stroke="#2a2f3a"/>
    <text x="42" y="393" fill="#35d399" font-weight="600">7  Audit</text>
    <text x="170" y="393" fill="#cfd5dd">Decisions, route and cost, written after the reply</text>
  </g>
</svg>
