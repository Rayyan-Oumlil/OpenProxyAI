<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="330" rx="12" fill="#0d0f14"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="11.5" fill="none" stroke="#1b1f27"/>
  <text x="24" y="40" fill="#f4f6f8" font-size="20" font-weight="600">Two kinds of cache, one safety wall</text>
  <text x="24" y="64" fill="#a3abb8" font-size="14">A hit means no provider call and no provider cost</text>
  <g font-size="14">
    <rect x="24" y="84" width="284" height="150" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="42" y="112" fill="#f4f6f8" font-weight="600" font-size="16">Exact cache</text>
    <text x="42" y="140" fill="#cfd5dd">Matches identical requests</text>
    <text x="42" y="162" fill="#cfd5dd">Same model, messages, settings</text>
    <text x="42" y="184" fill="#a3abb8">Safe default for repeat calls</text>
    <text x="42" y="214" fill="#35d399" font-weight="600">Opt in per deployment</text>
    <rect x="332" y="84" width="284" height="150" rx="10" fill="#14171e" stroke="#f0b429"/>
    <text x="350" y="112" fill="#f4f6f8" font-weight="600" font-size="16">Semantic cache</text>
    <text x="350" y="140" fill="#cfd5dd">Matches similar meaning</text>
    <text x="350" y="162" fill="#cfd5dd">Catches reworded questions</text>
    <text x="350" y="184" fill="#a3abb8">Best for FAQs and macros</text>
    <text x="350" y="214" fill="#f0b429" font-weight="600">Off by default, opt in</text>
    <rect x="24" y="250" width="592" height="56" rx="10" fill="#0f1f19" stroke="#35d399"/>
    <text x="42" y="274" fill="#f4f6f8" font-weight="600">Entries are never shared across organizations</text>
    <text x="42" y="294" fill="#a3abb8">Bypass the cache for a single request with one header</text>
  </g>
</svg>
