<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" role="img" aria-labelledby="t d">
  <title id="t">Attacker capabilities mapped to gateway controls</title>
  <desc id="d">Four things an attacker might be able to do, each paired with the gateway control that limits it.</desc>
  <rect x="0.5" y="0.5" width="639" height="339" rx="14" fill="#0d0f14" stroke="#1b1f27"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cfd5dd">
    <text x="24" y="36" font-size="20" font-weight="600" fill="#f4f6f8">Ask what the attacker can do</text>
    <text x="24" y="64" font-weight="600" fill="#a3abb8">Attacker can</text>
    <text x="320" y="64" font-weight="600" fill="#a3abb8">Gateway control</text>

    <rect x="24" y="76" width="260" height="48" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="105" fill="#f4f6f8">Send prompts</text>
    <rect x="320" y="76" width="296" height="48" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="336" y="105">Guardrails, log-only first</text>

    <rect x="24" y="138" width="260" height="48" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="167" fill="#f4f6f8">Plant text in a document</text>
    <rect x="320" y="138" width="296" height="48" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="336" y="167">Injection checks, side-effect tools gated</text>

    <rect x="24" y="200" width="260" height="48" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="229" fill="#f4f6f8">Control a tool server</text>
    <rect x="320" y="200" width="296" height="48" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="336" y="229">Pinned definitions, grants, scans</text>

    <rect x="24" y="262" width="260" height="48" rx="10" fill="#14171e" stroke="#2a2f3a"/>
    <text x="40" y="291" fill="#f4f6f8">Hold a stolen key</text>
    <rect x="320" y="262" width="296" height="48" rx="10" fill="#14171e" stroke="#35d399"/>
    <text x="336" y="291">Limits, expiry, instant revocation</text>

    <g stroke="#35d399" stroke-width="2" fill="none">
      <path d="M284 100 L316 100"/>
      <path d="M284 162 L316 162"/>
      <path d="M284 224 L316 224"/>
      <path d="M284 286 L316 286"/>
    </g>
  </g>
</svg>
